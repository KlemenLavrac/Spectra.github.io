# ──────────────────────────────────────────────
# SPECTRA — Jekyll Configuration
# ──────────────────────────────────────────────

title: SPECTRA
tagline: "Process Intelligence for Manufacturing"
description: >-
  SPECTRA is a process intelligence platform for pharma, food, and biotech
  manufacturers. Upload batch data, run multivariate analysis (PCA, PLS,
  correlation matrices), and get AI-generated insights — without a data
  science team.

url: "https://klemenlavrac.github.io"
baseurl: "/Spectra.github.io"

# Contact
email: demo@spectra.app
linkedin: "https://linkedin.com/company/spectra"

# Navigation links shown in the top bar
nav_links:
  - title: Features
    url: "/#section-s"
  - title: Documentation
    url: "/docs/"
  - title: Use Cases
    url: "/usecases/"
  - title: Blog
    url: "/blog/"
  - title: Roadmap
    url: "/#roadmap"

# Collections
collections:
  docs:
    output: true
    permalink: /docs/:slug/
  usecases:
    output: true
    permalink: /usecases/:slug/

# Plugins — must be listed here AND in the Gemfile
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Build
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:title/
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

# Defaults
defaults:
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "doc"
  - scope:
      path: ""
      type: "usecases"
    values:
      layout: "usecase"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
