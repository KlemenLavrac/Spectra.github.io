<!--
  Navigation bar.
  Landing page: letter nav (center) + text links (desktop) + hamburger (mobile)
  Inner pages: text links + hamburger (mobile)
-->
<nav class="site-nav" id="site-nav">
  <div class="nav-inner">

    <!-- Logo — hidden on mobile landing to make room for letter nav -->
    <a href="{{ '/' | relative_url }}" class="nav-logo" aria-label="SPECTRA home">
      SPECTRA
    </a>

    <!-- SPECTRA Letter Nav — only on landing page -->
    {% if page.layout == 'landing' %}
    <div class="letter-nav" id="letter-nav" role="tablist" aria-label="Section navigation">
      <span class="nav-letter" data-target="section-s" role="tab" tabindex="0" aria-label="System">S</span>
      <span class="nav-letter" data-target="section-p" role="tab" tabindex="0" aria-label="Process">P</span>
      <span class="nav-letter" data-target="section-e" role="tab" tabindex="0" aria-label="Evaluation">E</span>
      <span class="nav-letter" data-target="section-c" role="tab" tabindex="0" aria-label="Compliance">C</span>
      <span class="nav-letter" data-target="section-t" role="tab" tabindex="0" aria-label="Tracking">T</span>
      <span class="nav-letter" data-target="section-r" role="tab" tabindex="0" aria-label="Reporting">R</span>
      <span class="nav-letter" data-target="section-a" role="tab" tabindex="0" aria-label="Analysis">A</span>
    </div>
    {% endif %}

    <!-- Desktop text links -->
    <div class="nav-links" id="nav-links-desktop">
      {% for link in site.nav_links %}
      <a href="{{ link.url | relative_url }}" class="nav-link">{{ link.title }}</a>
      {% endfor %}
    </div>

    <!-- Right side: CTA + hamburger -->
    <div class="nav-actions">
      <a href="{{ site.linkedin }}" target="_blank" rel="noopener noreferrer" class="nav-social" aria-label="LinkedIn">
        <i class="fab fa-linkedin fa-lg"></i>
      </a>
      <button class="btn btn-primary btn-sm nav-cta-desktop" data-demo-trigger>
        Request Demo
      </button>
      <!-- Hamburger — visible on mobile -->
      <button class="hamburger" id="hamburger-btn" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>

  </div>
</nav>

<!-- Mobile slide-out drawer -->
<div class="mobile-drawer" id="mobile-drawer" aria-hidden="true">
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <div class="drawer-panel">
    <div class="drawer-links">
      {% for link in site.nav_links %}
      <a href="{{ link.url | relative_url }}" class="drawer-link">{{ link.title }}</a>
      {% endfor %}
    </div>
    <div class="drawer-bottom">
      <button class="btn btn-primary btn-md" style="width: 100%; border-radius: 0.5rem;" data-demo-trigger>
        Request Demo
      </button>
      <a href="{{ site.linkedin }}" target="_blank" rel="noopener noreferrer" class="drawer-social">
        <i class="fab fa-linkedin"></i> LinkedIn
      </a>
    </div>
  </div>
</div>
